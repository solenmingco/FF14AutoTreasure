name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT: AutoTreasure/AutoTreasure.csproj

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # The Dalamud.NET.Sdk needs a Dalamud installation to reference its
      # assemblies from. DALAMUD_HOME is the SDK's documented override.
      - name: Download Dalamud dev distribution
        shell: pwsh
        run: |
          $dalamudHome = "${{ github.workspace }}/dalamud-dev"
          New-Item -ItemType Directory -Force -Path $dalamudHome | Out-Null
          $url = "https://goatcorp.github.io/dalamud-distrib/latest.zip"
          Invoke-WebRequest -Uri $url -OutFile "dalamud-dev.zip" -UseBasicParsing
          Expand-Archive -Path "dalamud-dev.zip" -DestinationPath $dalamudHome -Force
          "DALAMUD_HOME=$dalamudHome" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build
        run: dotnet build ${{ env.PROJECT }} -c Release --no-restore

      - name: Locate build artifact
        shell: pwsh
        id: artifact
        run: |
          $zip = Get-ChildItem -Path AutoTreasure/bin/Release -Filter "latest.zip" -Recurse |
                 Select-Object -First 1
          if (-not $zip) { throw "latest.zip not found - check DalamudPackager output" }
          Write-Host "Found $($zip.FullName)"
          "zip=$($zip.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoTreasure-release
          path: ${{ env.zip }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.zip }}
          generate_release_notes: true
